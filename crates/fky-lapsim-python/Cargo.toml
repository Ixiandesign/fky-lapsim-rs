[package]
name = "fky-lapsim-python"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "PyO3 bindings exposing fky-lapsim-core to Python as the fky_lapsim._native extension module."
readme = "README.md"
publish = false
[lib]
name = "_native"
crate-type = ["cdylib"]
[dependencies]
fky-lapsim-core = { path = "../fky-lapsim-core" }
pyo3 = { version = "0.27", features = ["extension-module"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde = "1"
